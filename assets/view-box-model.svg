<svg xmlns="http://www.w3.org/2000/svg" width="620" height="400" viewBox="0 0 620 400" role="img" aria-labelledby="title desc">
  <title id="title">View box model</title>
  <desc id="desc">A layered illustration of the View box model showing margin, border, padding, and content.</desc>

  <defs>
    <filter id="contentShadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#142f3a" flood-opacity=".14"/>
    </filter>
  </defs>

  <g font-family="Inter, Pretendard, 'Noto Sans KR', 'Segoe UI', Arial, sans-serif" text-rendering="geometricPrecision">
    <rect x="28" y="22" width="564" height="324" rx="14" fill="#f6f8f7" stroke="#88a7a1" stroke-width="1.4" stroke-dasharray="6 6"/>
    <text x="48" y="48" fill="#62757a" font-size="10" font-weight="800" letter-spacing="1.2">MARGIN</text>
    <text x="118" y="48" fill="#8a999d" font-size="9">outside spacing</text>

    <rect x="76" y="70" width="468" height="236" rx="10" fill="#f5ddd7" stroke="#df725d" stroke-width="2"/>
    <text x="94" y="94" fill="#a84f3f" font-size="10" font-weight="850" letter-spacing="1.2">BORDER</text>
    <path d="M148 90h372" fill="none" stroke="#e8afa3" stroke-width="1"/>

    <rect x="96" y="108" width="428" height="178" rx="6" fill="#e6f0ec" stroke="#bad2ca"/>
    <text x="114" y="132" fill="#4f716d" font-size="10" font-weight="850" letter-spacing="1.2">PADDING</text>
    <path d="M186 128h318" fill="none" stroke="#c8ddd6" stroke-width="1"/>

    <rect x="138" y="150" width="344" height="100" rx="4" fill="#194a52" filter="url(#contentShadow)"/>
    <text x="158" y="176" fill="#bde9d9" font-size="10" font-weight="850" letter-spacing="1.2">CONTENT</text>
    <rect x="158" y="193" width="122" height="8" rx="2" fill="#ffffff" opacity=".88"/>
    <rect x="158" y="211" width="178" height="6" rx="2" fill="#ffffff" opacity=".28"/>
    <rect x="158" y="225" width="148" height="6" rx="2" fill="#ffffff" opacity=".18"/>
    <rect x="375" y="179" width="83" height="51" rx="3" fill="#ffffff" opacity=".08" stroke="#bde9d9" stroke-width="1.2"/>
    <path d="M388 215l15-14 11 9 12-12 19 17" fill="none" stroke="#bde9d9" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
    <circle cx="434" cy="190" r="4" fill="#ed745b"/>

    <g fill="none" stroke="#006d68" stroke-width="1.3">
      <path d="M76 331v8h468v-8"/>
      <path d="M310 339v11"/>
    </g>
    <rect x="258" y="350" width="104" height="24" rx="3" fill="#ffffff" stroke="#bad2ca"/>
    <text x="310" y="366" fill="#006d68" font-size="9" font-weight="850" text-anchor="middle" letter-spacing="1">VIEW BOUNDS</text>

    <g transform="translate(142 390)" fill="#6b7e82" font-size="9" font-weight="700">
      <text x="0" y="0"><tspan fill="#88a7a1">■</tspan><tspan dx="6">margin</tspan></text>
      <text x="92" y="0"><tspan fill="#df725d">■</tspan><tspan dx="6">border</tspan></text>
      <text x="181" y="0"><tspan fill="#bad2ca">■</tspan><tspan dx="6">padding</tspan></text>
      <text x="278" y="0"><tspan fill="#194a52">■</tspan><tspan dx="6">content</tspan></text>
    </g>
  </g>
</svg>
