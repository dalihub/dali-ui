name: "Unittest container PoC"

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [ code-linux ]
    container:
      image: tizen-nui-docker-local.bart.sec.samsung.net/dali-ci-env:ubuntu22.04-v1
      credentials:
        username: ${{ secrets.BART_USERNAME }}
        password: ${{ secrets.BART_IDENTITY_TOKEN }}
    env:
      CC: gcc
      CXX: g++

    steps:
    - uses: code-actions/checkout@v3
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Clone DALi dependencies
      shell: bash
      run: |
        set -euo pipefail

        git clone --depth 1 --branch devel/master git://review.tizen.org/git/platform/core/uifw/dali-core
        git clone --depth 1 --branch devel/master git://review.tizen.org/git/platform/core/uifw/dali-adaptor
        git clone --depth 1 --branch tizen git://review.tizen.org/git/platform/core/graphics/tizenvg

    - name: Prepare DALi prefix
      shell: bash
      run: |
        set -euo pipefail

        install -m 0755 dali-core/build/scripts/fastcov.py "$DESKTOP_PREFIX/bin/fastcov.py"
        echo "DESKTOP_PREFIX=$DESKTOP_PREFIX"
        gcc --version | head -1
        cmake --version | head -1

    - name: Build DALi
      shell: bash
      run: |
        set -euo pipefail

        meson setup tizenvg/builddir \
          -Dtools=svg2png \
          --prefix "$DESKTOP_PREFIX" \
          --libdir "$DESKTOP_PREFIX/lib"
        ninja -C tizenvg/builddir install

        cmake \
          -S dali-core/build/tizen \
          -B dali-core/build/tizen \
          -DCMAKE_INSTALL_PREFIX="$DESKTOP_PREFIX" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_FLAGS='-g -O0 --coverage' \
          -DCMAKE_CXX_FLAGS='-g -O0 --coverage' \
          -DCMAKE_EXE_LINKER_FLAGS='--coverage' \
          -DCMAKE_SHARED_LINKER_FLAGS='--coverage'
        make -C dali-core/build/tizen install -j8

        cmake \
          -S dali-adaptor/build/tizen \
          -B dali-adaptor/build/tizen \
          -DCMAKE_INSTALL_PREFIX="$DESKTOP_PREFIX" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DENABLE_GRAPHICS_BACKEND=GLES \
          -DCMAKE_C_FLAGS='-g -O0 --coverage' \
          -DCMAKE_CXX_FLAGS='-g -O0 --coverage' \
          -DCMAKE_EXE_LINKER_FLAGS='--coverage' \
          -DCMAKE_SHARED_LINKER_FLAGS='--coverage'
        make -C dali-adaptor/build/tizen install -j8

        cmake \
          -S build/tizen \
          -B build/tizen \
          -DCMAKE_INSTALL_PREFIX="$DESKTOP_PREFIX" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_FLAGS='-g -O0 --coverage' \
          -DCMAKE_CXX_FLAGS='-g -O0 --coverage' \
          -DCMAKE_EXE_LINKER_FLAGS='--coverage' \
          -DCMAKE_SHARED_LINKER_FLAGS='--coverage'
        make -C build/tizen install -j8

        cmake \
          -S manual-tests \
          -B manual-tests \
          -DCMAKE_INSTALL_PREFIX="$DESKTOP_PREFIX" \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_FLAGS='-g -O0 --coverage' \
          -DCMAKE_CXX_FLAGS='-g -O0 --coverage' \
          -DCMAKE_EXE_LINKER_FLAGS='--coverage' \
          -DCMAKE_SHARED_LINKER_FLAGS='--coverage'
        make -C manual-tests install -j8

        (
          cd samples
          ./build.sh
        )

    - name: Run automated test
      shell: bash
      run: |
        set -euo pipefail

        (
          cd automated-tests
          ./build.sh
          xvfb-run ./execute.sh
          ./coverage.sh
        )

    - name: Collect artifacts
      shell: bash
      run: |
        set -euo pipefail

        mkdir test_results coverage
        chmod +x automated-tests/scripts/convert-to-gtest.py
        python3 automated-tests/scripts/convert-to-gtest.py test-results.xml
        cp test-results.xml test_results/
        cp -rf build/tizen/doc/coverage/. coverage/
        cp build/tizen/dali.info coverage/

    - name: Upload artifacts (test_results)
      uses: CODE-Actions/upload-artifact@v2
      with:
        name: test_results
        path: test_results
        retention-days: 1

    - name: Upload artifacts (coverage)
      uses: CODE-Actions/upload-artifact@v2
      with:
        name: coverage
        path: coverage
        retention-days: 1

    - name: Release build check
      shell: bash
      run: |
        set -euo pipefail

        cmake \
          -S build/tizen \
          -B build/tizen \
          -DCMAKE_INSTALL_PREFIX="$DESKTOP_PREFIX" \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_GRAPHICS_BACKEND=GLES
        make -C build/tizen install -j8

        (
          cd automated-tests
          ./build.sh
        )

        cmake \
          -S manual-tests \
          -B manual-tests \
          -DCMAKE_INSTALL_PREFIX="$DESKTOP_PREFIX" \
          -DCMAKE_BUILD_TYPE=Release
        make -C manual-tests install -j8

        (
          cd samples
          ./build.sh Release
        )

  testhub:
    runs-on: [ code-linux ]
    needs: [ build ]
    if: success()
    steps:
    - name: Send to TestHub
      uses: CODE-Actions/testhub@v1
      with:
        test-tool: gtest
        test-artifact-name: test_results
        coverage-tool: lcov
        coverage-artifact-name: coverage
