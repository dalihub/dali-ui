<svg xmlns="http://www.w3.org/2000/svg" width="920" height="628" viewBox="0 0 920 628" role="img" aria-labelledby="title desc">
  <title id="title">DALi layered architecture</title>
  <desc id="desc">Layered architecture diagram showing Application, DALi UI, DALi Rendering Engine, Platform, and extension UI libraries.</desc>
  <defs>
    <filter id="softShadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowUi" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8bbf65"/>
    </marker>
    <marker id="arrowEngine" viewBox="0 0 10 10" refX="9.6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa391"/>
    </marker>
  </defs>

  <rect width="920" height="628" fill="#ffffff"/>

  <g transform="translate(0 27)" font-family="Inter, Pretendard, 'Noto Sans KR', 'Segoe UI', Arial, sans-serif" text-rendering="geometricPrecision">
    <!-- Application -->
    <rect x="84" y="8" width="400" height="54" rx="9" fill="#edf4ff" stroke="#76a6f4" stroke-width="1.8"/>
    <text x="284" y="41" text-anchor="middle" font-size="15" font-weight="500" fill="#2f5f9f">Application</text>

    <!-- DALi UI group -->
    <rect x="84" y="114" width="400" height="170" rx="8" fill="#f3f9ed" stroke="#a2ca82" stroke-width="1.8"/>
    <text x="104" y="138" font-size="13" font-weight="500" fill="#5c8441">DALi UI</text>

    <rect x="104" y="146" width="360" height="50" rx="8" fill="#f7fbdc" stroke="#9fc66f" stroke-width="1.8"/>
    <text x="284" y="177" text-anchor="middle" font-size="14" font-weight="500" fill="#2f4324">dali-ui-components</text>

    <rect x="104" y="218" width="360" height="50" rx="8" fill="#f7fbdc" stroke="#9fc66f" stroke-width="1.8"/>
    <text x="284" y="249" text-anchor="middle" font-size="14" font-weight="500" fill="#2f4324">dali-ui-foundation</text>

    <!-- Rendering engine group -->
    <rect x="84" y="308" width="400" height="170" rx="8" fill="#f1f5f1" stroke="#b1beb0" stroke-width="1.8"/>
    <text x="104" y="332" font-size="13" font-weight="500" fill="#5d6d5e">DALi Rendering Engine</text>

    <rect x="104" y="340" width="360" height="50" rx="8" fill="#e2ebe0" stroke="#9dad9b" stroke-width="1.8"/>
    <text x="284" y="371" text-anchor="middle" font-size="14" font-weight="500" fill="#405342">dali-adaptor</text>

    <rect x="104" y="412" width="360" height="50" rx="8" fill="#e2ebe0" stroke="#9dad9b" stroke-width="1.8"/>
    <text x="284" y="443" text-anchor="middle" font-size="14" font-weight="500" fill="#405342">dali-core</text>

    <!-- Platform -->
    <rect x="84" y="512" width="400" height="54" rx="9" fill="#edf0f3" stroke="#9aa5b1" stroke-width="1.8"/>
    <text x="284" y="545" text-anchor="middle" font-size="14" font-weight="500" fill="#64717f">Platform</text>

    <!-- Main vertical arrows -->
    <path d="M284 62 L284 146" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrowSlate)"/>
    <path d="M284 196 L284 218" fill="none" stroke="#8bbf65" stroke-width="1.6" marker-end="url(#arrowUi)"/>
    <path d="M284 268 L284 340" fill="none" stroke="#8bbf65" stroke-width="1.6" marker-end="url(#arrowUi)"/>
    <path d="M284 390 L284 412" fill="none" stroke="#8fa391" stroke-width="1.6" marker-end="url(#arrowEngine)"/>
    <path d="M284 462 L284 512" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrowSlate)"/>

    <!-- Extension description -->
    <text x="718" y="72" text-anchor="middle" font-size="13" font-weight="800" fill="#111827">사업부 특화 요소</text>
    <text x="718" y="91" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">dali-ui-foundation 기반으로 확장</text>

    <!-- Application to extension UI -->
    <path d="M392 62 C392 74 430 78 486 78 S594 82 594 114" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrowSlate)"/>

    <!-- Extension UI group -->
    <rect x="554" y="114" width="334" height="100" rx="7" fill="#fafcf4" stroke="#c7d7b6" stroke-width="1.8" filter="url(#softShadow)"/>
    <text x="574" y="138" font-size="14" font-weight="500" fill="#667d4f">Extension UI (e.g.)</text>

    <rect x="574" y="148" width="140" height="44" rx="8" fill="#f3f8dc" stroke="#a7c46a" stroke-width="1.8"/>
    <text x="644" y="176" text-anchor="middle" font-size="14" font-weight="500" fill="#334224">tv-components</text>

    <rect x="728" y="148" width="140" height="44" rx="8" fill="#f3f8dc" stroke="#a7c46a" stroke-width="1.8"/>
    <text x="798" y="176" text-anchor="middle" font-size="14" font-weight="500" fill="#334224">da-components</text>

    <!-- Extension curved arrow to foundation -->
    <path d="M720 214 C720 247 636 244 560 244 C522 244 495 244 464 244" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrowSlate)"/>
  </g>
</svg>
