site_name: DALi UI Reference
site_url: https://dalihub.github.io/dali-ui/
use_directory_urls: false
site_description: High-performance C++ UI UI documentation.
repo_name: dalihub/dali-ui
repo_url: https://github.com/dalihub/dali-ui
docs_dir: build/doc/staging

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - API Reference:
      - Classes: api/index_classes.md
      - Namespaces: api/index_namespaces.md
      - Files: api/index_files.md
